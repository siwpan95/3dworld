# 星阑 / Voidward · cordis.yml 配置树（P1-⑥ §15 太空贸易）
#
# 声明「本次挂哪些插件」——共同核 + 内核全由配置驱动；Cordis 按 inject 依赖图自动
# 排序挂载（VoidKernel.inject = [render, rules, economy, entity]，零手工编排）。
# 扁平 entry 列表（嵌套 plugin-group 会让子服务对根 ctx 不可见，见 cordis.godhand.yml 注释）。
#
# 本文件同时是 examples/voidward.py 的实际挂载声明（host.tree.mount_tree 加载本文件）——
# 「demo 怎么挂的 = headless 验证怎么挂的」，接线只有这一份。
#
#   seed         —— 市场种子（同种子 → 同价格/同事件冲击，录制与验收可锁定）
#   target_asset —— 资产达标线（credits + 货值 >= 此值 → asset_reached → won）
#   pirates      —— 海盗数量（2~3，§15.3 范围）
#
# 运行（headless 验证）：python -m cli.config_boot void
- name: render
  id: render
- name: economy
  id: economy
  config:
    score: 0                  # 计分资源（本内核不用）
- name: entity
  id: entity
- name: rules
  id: rules
  config:
    base_hp: 6                # 船体（player_hit 复用为船体耐久）
- name: void
  id: void
  config:
    seed: 20261012
    target_asset: 10000
    pirates: 3

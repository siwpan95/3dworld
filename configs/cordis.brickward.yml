# 《砖境 / Brickward》 · cordis.yml 配置树（BQM 机制致敬 · B1/B2/B3）
#
# 本文件同时是《砖境》演示的**实际挂载声明**（演示已迁往独立仓 siwpan/3dworld-demos）：
# 其 examples/brickward.py 的 _mount_kernel 经
# host.tree.mount_tree(config_path('cordis.brickward.yml'), want=WANT_BRICKWARD) 加载
# 本文件 —— 「demo 怎么挂的 = headless 验证怎么挂的」，接线只有这一份。
#
# 只挂两个服务：
#   * `brickward` —— 内核自身。它 `inject = []`（纯逻辑、零 GL），
#     B1~B2 的全部验收（可解性 / 回放到胜 / 确定性）都不需要任何渲染资源；
#   * `render`    —— B3 的 demo 要用它记账 GL 资源（配树里没有它，demo 就没有
#     `ctx.render` 可取句柄）。
# ⚠ 内核**自己不取 GL 句柄**，所以 `cli/config_boot` 对 brickward 传 `require_gl=False`
#   —— 否则那套"等 live_count() > 0"的就绪判定会一直等不到东西（见 run_one 的注释）。
#
# 运行（headless 验证）：python -m world3d.cli.config_boot brickward
# 运行（可玩演示）：    3dworld-demos 仓内 python examples/brickward.py
# 运行（auto 回放）：   3dworld-demos 仓内 python examples/brickward.py --flag auto
- name: brickward
  id: brickward_kernel
- name: render
  id: render

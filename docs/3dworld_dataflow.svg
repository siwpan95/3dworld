<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" font-family="'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="page2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke-width:1.5; rx:9; }
      .h   { font-size:12.5px; font-weight:700; }
      .t   { font-size:11px; fill:#334155; }
      .tl  { font-size:13.5px; font-weight:700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="620" fill="url(#page2)"/>
  <text x="32" y="34" font-size="22" font-weight="700" fill="#0f172a">3dworld · 核心数据流图</text>

  <!-- ============ ① Boot ============ -->
  <text x="32" y="64" class="tl" fill="#6d28d9">① 配置驱动挂载 (host.tree + Cordis) — 接线只有这一份，demo 与 headless 验证共用</text>

  <rect x="40"  y="78"  width="180" height="62" class="box" stroke="#7c3aed"/>
  <text x="52"  y="98"  class="h" fill="#6d28d9">cordis.&lt;name&gt;.yml</text>
  <text x="52"  y="114" class="t">声明本次挂哪些服务</text>
  <text x="52"  y="128" class="t">(name + config)</text>

  <line x1="220" y1="109" x2="240" y2="109" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="242" y="78"  width="194" height="62" class="box" stroke="#7c3aed"/>
  <text x="254" y="98"  class="h" fill="#6d28d9">host.tree.load_tree</text>
  <text x="254" y="114" class="t">yaml.safe_load → 白名单</text>
  <text x="254" y="128" class="t">_validate_entry_names</text>

  <line x1="436" y1="109" x2="456" y2="109" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="458" y="78"  width="190" height="62" class="box" stroke="#7c3aed"/>
  <text x="470" y="98"  class="h" fill="#6d28d9">registry.bind(短名)</text>
  <text x="470" y="114" class="t">→ _3dwsrv.&lt;name&gt;</text>
  <text x="470" y="128" class="t">封闭表解析实现类</text>

  <line x1="648" y1="109" x2="668" y2="109" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="670" y="78"  width="190" height="62" class="box" stroke="#7c3aed"/>
  <text x="682" y="98"  class="h" fill="#6d28d9">Cordis Loader</text>
  <text x="682" y="114" class="t">inject 依赖图自动排序</text>
  <text x="682" y="128" class="t">构造 Service 实例</text>

  <line x1="860" y1="109" x2="880" y2="109" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="882" y="78"  width="160" height="62" class="box" stroke="#7c3aed"/>
  <text x="894" y="98"  class="h" fill="#6d28d9">Service 初始化</text>
  <text x="894" y="114" class="t">__init__ provide</text>
  <text x="894" y="128" class="t">__cordis_init__ 取GL</text>

  <line x1="962" y1="140" x2="962" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="300" y="168" width="480" height="46" class="box" stroke="#16a34a"/>
  <text x="312" y="188" class="h" fill="#15803d">await_ready()</text>
  <text x="312" y="206" class="t">等待 want 中服务全部可达 且 render.live_count()&gt;0 → 返回 ctx，ctx.render / ctx.rules / ctx.economy / ctx.entity 立即可用</text>

  <!-- ============ ② Runtime loop ============ -->
  <text x="32" y="250" class="tl" fill="#1d4ed8">② 每帧运行时循环 (EngineApp._tick → update → render)</text>

  <rect x="40"  y="266" width="200" height="56" class="box" stroke="#2563eb"/>
  <text x="52"  y="286" class="h" fill="#1d4ed8">EngineApp._tick(dt)</text>
  <text x="52"  y="302" class="t">累加 self.time，未暂停则推进</text>
  <text x="52"  y="317" class="t">调用 update(dt)</text>

  <line x1="240" y1="294" x2="266" y2="294" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="268" y="266" width="236" height="56" class="box" stroke="#2563eb"/>
  <text x="280" y="286" class="h" fill="#1d4ed8">kernel.update(dt)</text>
  <text x="280" y="302" class="t">消费 ctx.economy/rules/</text>
  <text x="280" y="317" class="t">entity/render 推进游戏状态</text>

  <line x1="504" y1="294" x2="530" y2="294" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="532" y="266" width="240" height="56" class="box" stroke="#2563eb"/>
  <text x="544" y="286" class="h" fill="#1d4ed8">engine.Renderer</text>
  <text x="544" y="302" class="t">天空 pass → MRT 几何 pass</text>
  <text x="544" y="317" class="t">(不透明 → 半透明排序)</text>

  <line x1="772" y1="294" x2="798" y2="294" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="800" y="266" width="240" height="56" class="box" stroke="#2563eb"/>
  <text x="812" y="286" class="h" fill="#1d4ed8">后处理 → 屏幕</text>
  <text x="812" y="302" class="t">SSAO → Bloom → 合成</text>
  <text x="812" y="317" class="t">(曝光 / ACES / gamma)</text>

  <line x1="920" y1="322" x2="920" y2="346" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="600" y="348" width="440" height="44" class="box" stroke="#2563eb"/>
  <text x="612" y="367" class="h" fill="#1d4ed8">HUD 叠层 · 截图(capture) · 音频同步 · 性能面板</text>
  <text x="612" y="384" class="t">渲染帧间隔采样 (perf.cpu) — 回到 _tick 进入下一帧</text>

  <path d="M600,370 C 480,372 300,360 200,322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- ============ ③ Scene data ============ -->
  <text x="32" y="440" class="tl" fill="#0e7490">③ 场景数据来源 (JSON 场景 → Node 场景图 → Renderer)</text>

  <rect x="40"  y="456" width="210" height="56" class="box" stroke="#0891b2"/>
  <text x="52"  y="476" class="h" fill="#0e7490">场景 JSON</text>
  <text x="52"  y="492" class="t">LLM 生成 / 手写 /</text>
  <text x="52"  y="507" class="t">llm_scene_demo.json</text>

  <line x1="250" y1="484" x2="276" y2="484" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="278" y="456" width="206" height="56" class="box" stroke="#0891b2"/>
  <text x="290" y="476" class="h" fill="#0e7490">scene_build.validate</text>
  <text x="290" y="492" class="t">纯 CPU 校验</text>
  <text x="290" y="507" class="t">(无窗口可跑，挡住幻觉参数)</text>

  <line x1="484" y1="484" x2="510" y2="484" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="512" y="456" width="212" height="56" class="box" stroke="#0891b2"/>
  <text x="524" y="476" class="h" fill="#0e7490">build_meshdata / material</text>
  <text x="524" y="492" class="t">生成器(builder) → MeshData</text>
  <text x="524" y="507" class="t">材质 preset + 覆盖字段</text>

  <line x1="724" y1="484" x2="750" y2="484" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="752" y="456" width="288" height="56" class="box" stroke="#0891b2"/>
  <text x="764" y="476" class="h" fill="#0e7490">Scene (Node TRS 场景图)</text>
  <text x="764" y="492" class="t">脏标记 + 视锥剔除收集</text>
  <text x="764" y="507" class="t">→ Renderer 消费 (见 ②)</text>

  <text x="32" y="556" class="t" fill="#64748b">铁律：依赖只允许向下 (games → core → engine → pyglet/GL)；内核之间、游戏之间禁止横向 import；共享件一律上提 (如 unit_cube/unit_sphere → engine.baked_mesh)。</text>
  <text x="32" y="576" class="t" fill="#64748b">演示程序 (39 个) 已迁至独立仓 siwpan/3dworld-demos；本仓为引擎库 (engine/core/host/cli/games + vendored cordis)，configs/ 与 assets/ 属仓库资产不随 wheel 分发。</text>
</svg>
